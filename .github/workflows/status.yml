# Checks the Samba every 5 minutes (GitHub may run it a few minutes late) and publishes the page on GitHub Pages.
# The history lives on the `state` branch: one commit, replaced each run, so the repository doesn't grow.
name: Verificar o Samba

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Testes
        if: github.event_name == 'push'
        run: node --test

      - name: Pegar o histórico
        run: |
          mkdir -p public/data
          set +e
          git ls-remote --exit-code --heads origin state > /dev/null
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            git fetch --depth=1 origin state
            git show FETCH_HEAD:state.json > public/data/state.json
          elif [ "$code" -eq 2 ]; then
            echo "Primeira verificação: histórico novo."
          else
            echo "Não deu para ler o histórico; parando para não apagar nada."
            exit 1
          fi

      - name: Verificar
        run: node check.mjs public/data/state.json

      - name: Guardar o histórico
        env:
          TOKEN: ${{ github.token }}
        run: |
          dir=$(mktemp -d)
          cp public/data/state.json "$dir/"
          cd "$dir"
          git init -q -b state
          git add state.json
          git -c user.name="samba-status" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Histórico"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state

      # GitHub turns off scheduled workflows after 60 days without activity in the repository.
      - name: Manter o agendamento ligado
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct HEAD) ))
          if [ "$age" -gt $((45 * 86400)) ]; then
            git -c user.name="samba-status" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --allow-empty -qm "Manter a verificação ligada"
            git push -q origin HEAD:main
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
